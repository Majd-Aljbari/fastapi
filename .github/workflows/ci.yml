name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint und Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: uv installieren
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Abhaengigkeiten installieren
        run: uv sync --all-groups

      - name: ruff check
        run: uv run ruff check --preview src tests

      - name: ruff format
        run: uv run ruff format --preview --check src tests

      - name: ty check
        run: uv run ty check src tests/unit tests/integration
