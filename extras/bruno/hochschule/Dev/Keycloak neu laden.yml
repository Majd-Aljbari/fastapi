info:
  name: Keycloak neu laden
  type: http
  seq: 2

http:
  method: QUERY
  url: "{{devUrl}}/keycloak_populate"
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application\/json
    - expression: res.body.keycloak_populate
      operator: eq
      value: success

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
