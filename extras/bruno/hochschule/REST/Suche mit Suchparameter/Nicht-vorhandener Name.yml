info:
  name: Nicht-vorhandener Name
  type: http
  seq: 3

http:
  method: GET
  url: "{{restUrl}}?name=XYZNichtVorhanden"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
