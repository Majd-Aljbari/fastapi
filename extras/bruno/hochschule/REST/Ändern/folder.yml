info:
  name: Ändern
  type: folder
  seq: 5

request:
  auth:
    type: bearer
    token: "{{TOKEN}}"
  scripts:
    - type: before-request
      code: |-
        const tokenUrl = bru.getCollectionVar('tokenUrl');
        const username = bru.getEnvVar('username') || 'admin';
        const password = bru.getEnvVar('password') || 'p';
        const response = await bru.sendRequest({
          method: 'QUERY',
          url: tokenUrl,
          data: { username, password },
        });
        bru.setVar('TOKEN', response.data.token);
