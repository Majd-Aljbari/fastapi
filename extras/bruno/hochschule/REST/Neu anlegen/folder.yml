info:
  name: Neu anlegen
  type: folder
  seq: 4

request:
  auth:
    type: bearer
    token: "{{TOKEN}}"
  scripts:
    - type: before-request
      code: |-
        const tokenUrl = bru.getCollectionVar('tokenUrl');
        const baseUrl = bru.getCollectionVar('baseUrl');
        const username = bru.getEnvVar('username') || 'admin';
        const password = bru.getEnvVar('password') || 'p';
        const tokenResponse = await bru.sendRequest({
          method: 'QUERY',
          url: tokenUrl,
          data: { username, password },
        });
        const token = tokenResponse.data.token;
        bru.setVar('TOKEN', token);
        await bru.sendRequest({
          method: 'QUERY',
          url: `${baseUrl}/dev/db_populate`,
          headers: { Authorization: `Bearer ${token}` },
        });
