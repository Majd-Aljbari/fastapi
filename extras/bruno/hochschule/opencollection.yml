opencollection: 1.0.0

info:
  name: hochschule
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: baseUrl
      value: https://127.0.0.1:8000
    - name: keycloakUrl
      value: https://localhost:8843
    - name: realm
      value: python
    - name: realmUrl
      value: "{{keycloakUrl}}/realms/{{realm}}"
    - name: oidcUrl
      value: "{{realmUrl}}/protocol/openid-connect"
    - name: oidcAuthUrl
      value: "{{oidcUrl}}/auth"
    - name: oidcTokenUrl
      value: "{{oidcUrl}}/token"
    - name: authUrl
      value: "{{baseUrl}}/auth"
    - name: tokenUrl
      value: "{{authUrl}}/token"
    - name: graphqlUrl
      value: "{{baseUrl}}/graphql"
    - name: username
      value: admin
    - name: password
      value: p
    - name: clientId
      value: python-client
    - name: clientSecret
      value: acme12345
bundled: false
extensions: {}
