info:
  name: Suche Hochschulen mit Namen Karlsruhe
  type: graphql
  seq: 3

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      query {
        hochschulen(suchparameter: { name: "Karlsruhe" }) {
          id
          version
          name
          homepage
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.hochschulen
      operator: isArray
    - expression: res.body.data.hochschulen
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
