info:
  name: Suche mit nicht-vorhandener ID 999999
  type: graphql
  seq: 4

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  body:
    query: |-
      query {
        hochschule(hochschuleId: "999999") {
          id
          name
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data.hochschule
      operator: isNull

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
