info:
  name: Neue Hochschule
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{graphqlUrl}}"
  headers:
    - name: ""
      value: ""
      disabled: true
  body:
    query: |-
      mutation {
        create(
          hochschuleInput: {
            name: "Hochschule GraphQL Test"
            homepage: "https://test.graphql"
            adresse: {
              strasse: "Teststraße"
              hausnummer: "42"
              plz: "99999"
              ort: "Teststadt"
            }
          }
        ) {
          id
        }
      }
  auth:
    type: bearer
    token: "{{TOKEN}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: eq
      value: application/json
    - expression: res.body.data
      operator: isJson
    - expression: res.body.data.create.id
      operator: gte
      value: "0"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
